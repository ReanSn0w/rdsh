# Include in nginx's http {} context. Attach nginx to PROXY_NETWORK beforehand.
map $http_upgrade $rdsh_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name dsh.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # Docker DNS: refresh after gateway container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rdsh_upstream rdsh-gateway:8080;

    location / {
        proxy_pass http://$rdsh_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rdsh_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 300m;
    }
}
