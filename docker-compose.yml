# Select exactly one publication override; the base publishes no host ports.
name: rdsh

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dsh:
    image: rdsh-dsh:local
    build:
      context: ./dsh
      args:
        RDSH_UID: ${RDSH_UID:-1000}
        RDSH_GID: ${RDSH_GID:-1000}
    user: "${RDSH_UID:-1000}:${RDSH_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /home/dsh
      DSH_HOME: /home/dsh/.dsh
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your public HTTPS URL}
      DSH_VERSION: ${DSH_VERSION:?Set an exact supported DSH_VERSION}
      DSH_HANDOFF_FILE: /run/rdsh/connection.json
    volumes:
      - type: bind
        source: ${DSH_HOME_PATH:-./data/home}
        target: /home/dsh
        bind:
          create_host_path: false
      - type: volume
        source: handoff
        target: /run/rdsh
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=536870912,mode=1777
    networks: [runtime]
    cpus: ${DSH_CPUS:-2}
    mem_limit: ${DSH_MEMORY:-3g}
    pids_limit: 512
    healthcheck:
      test: [CMD, node, /opt/rdsh/healthcheck.mjs]
      interval: 10s
      timeout: 5s
      start_period: 15m
      retries: 3
    restart: "on-failure:3"
    stop_grace_period: 30s
    logging: *logging

  gateway:
    image: rdsh-gateway:local
    build:
      context: ./gateway
      args:
        RDSH_UID: ${RDSH_UID:-1000}
        RDSH_GID: ${RDSH_GID:-1000}
    user: "${RDSH_UID:-1000}:${RDSH_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your public HTTPS URL}
      TLS_MODE: external
      HTTP_ADDR: :8080
      HTTPS_ADDR: :8443
      AUTH_USERNAME: ${AUTH_USERNAME:-token}
      AUTH_PASSWORD_HASH_FILE: /run/secrets/password_hash
      SESSION_SECRET_FILE: /run/secrets/session_secret
      STATE_DIR: /var/lib/rdsh
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DSH_HANDOFF_FILE: /run/rdsh/connection.json
      DSH_UPSTREAM: http://dsh:3080
    secrets:
      - password_hash
      - session_secret
    volumes:
      - type: volume
        source: handoff
        target: /run/rdsh
        read_only: true
      - type: volume
        source: gateway_state
        target: /var/lib/rdsh
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777
    networks: [runtime]
    depends_on:
      dsh:
        condition: service_healthy
    cpus: ${GATEWAY_CPUS:-0.5}
    mem_limit: ${GATEWAY_MEMORY:-128m}
    pids_limit: 64
    healthcheck:
      test: [CMD, /usr/local/bin/rdsh-gateway, healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: "on-failure:3"
    stop_grace_period: 15s
    logging: *logging

networks:
  runtime:
    driver: bridge

volumes:
  handoff:
  gateway_state:

secrets:
  password_hash:
    file: ./secrets/password_hash
  session_secret:
    file: ./secrets/session_secret
