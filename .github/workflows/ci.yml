name: Verify deployment

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rdsh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
      - name: Bash syntax
        run: bash -n scripts/install.sh
      - name: Compose and bootstrap boundaries
        run: python3 -m unittest discover -s tests/integration -p 'test_*.py' -v
      - name: Gateway unit and race checks
        working-directory: gateway
        run: go test -race ./...
      - name: Runtime lifecycle checks
        run: node --test tests/runtime/*.test.mjs

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        proxy-mode: [host, network, auto]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check Bash bootstrap and first-run hash command
        if: matrix.proxy-mode == 'host'
        run: python3 tests/integration/setup-smoke.py
      - name: Build images and exercise real DSH without model calls
        run: python3 tests/integration/smoke.py --proxy-mode '${{ matrix.proxy-mode }}'

  publish-images:
    needs: [checks, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
